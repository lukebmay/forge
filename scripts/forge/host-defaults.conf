# Host keyboard defaults applied by apply-host-defaults.zsh
# (and by switch-to-jcrussell / install-jcrussell after enable).
#
# Format (one directive per line; # comments; blank lines ignored):
#   forge.kbd.<key>=['<Super>x']     → org.gnome.shell.extensions.forge.keybindings
#   gnome.wm.<key>=['<Super>q']      → org.gnome.desktop.wm.keybindings
#   gnome.media.<key>=...            → org.gnome.settings-daemon.plugins.media-keys
#
# Why these exist:
#   • Forge enable() clears GNOME screensaver (to free Super+L for focus-right).
#     Lock must live on Forge prefs-lock-screen, not GNOME screensaver.
#   • Forge clears maximize/unmaximize; toggle-maximized is left alone → Super+Return.
#   • Super+q stays window close (GNOME), not Forge lock.

# Lock screen (Forge) — Super+Delete
forge.kbd.prefs-lock-screen=['<Super>Delete']

# Close / quit window (GNOME) — Super+q
gnome.wm.close=['<Super>q']

# Toggle maximize on/off (GNOME) — Super+Return / Super+Enter
# Forge floats a tiled window with siblings on full maximize so it sticks
# (edge half-snaps are still rejected). Sole tiled window maximizes in place.
gnome.wm.toggle-maximized=['<Super>Return']
